name: Run on Commit

# Triggers on every push to any branch (i.e. after every commit)
on:
  push:
    branches: [ "**" ]
  workflow_dispatch: {}   # lets you also trigger it manually from the Actions tab

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run script
        run: python main.py

      # Anything your script writes into ./output gets uploaded here.
      # Download it from the workflow run's "Summary" page under "Artifacts".
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: outputs-${{ github.sha }}
          path: output/
          if-no-files-found: ignore
          retention-days: 14
